[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ev-vision"
version = "0.1.0"
description = "Vision system for the 2025 E-problem autonomous aiming device"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "tomli>=2.0; python_version < '3.11'"]
vision = ["opencv-python>=4.8"]
hardware = ["pyserial>=3.5"]
tuning = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
ev-vision = "ev_vision.cli:main"
ev-camera-tuning = "ev_vision.web.camera_tuning_server:main"

[tool.setuptools]
py-modules = ["ev_vision_mvs_adapter"]

[tool.setuptools.package-data]
"ev_vision.web" = ["static/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
